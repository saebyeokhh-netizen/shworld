<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="복붙답답 버튼 바가 문서 창 위에 떠 있는 모습을 나타낸 그림">
  <defs>
    <linearGradient id="deskbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe5ee"/>
      <stop offset="1" stop-color="#c9d2e0"/>
    </linearGradient>
    <filter id="barShadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d1522" flood-opacity="0.32"/>
    </filter>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d1522" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="14" fill="url(#deskbg)"/>
  <g transform="translate(0 42)">

  <!-- 뒤에 깔린 문서 창 -->
  <g filter="url(#winShadow)">
    <rect x="96" y="58" width="768" height="330" rx="10" fill="#ffffff"/>
    <rect x="96" y="58" width="768" height="34" rx="10" fill="#f1f3f7"/>
    <rect x="96" y="82" width="768" height="10" fill="#f1f3f7"/>
    <circle cx="118" cy="75" r="5.5" fill="#e2574c"/>
    <circle cx="136" cy="75" r="5.5" fill="#f5a623"/>
    <circle cx="154" cy="75" r="5.5" fill="#22b573"/>
    <text x="480" y="80" text-anchor="middle" font-family="Segoe UI, Malgun Gothic, sans-serif" font-size="13" fill="#6b7280">문의 답변 작성 중</text>
    <g fill="#c8cdd8">
      <rect x="132" y="124" width="420" height="11" rx="5.5"/>
      <rect x="132" y="152" width="596" height="11" rx="5.5"/>
      <rect x="132" y="180" width="520" height="11" rx="5.5"/>
      <rect x="132" y="226" width="360" height="11" rx="5.5"/>
      <rect x="132" y="254" width="576" height="11" rx="5.5"/>
    </g>
    <rect x="132" y="292" width="150" height="11" rx="5.5" fill="#9aa3b2"/>
    <rect x="288" y="288" width="2" height="19" fill="#4c8dff"/>
  </g>

  <!-- 떠 있는 버튼 바 -->
  <g filter="url(#barShadow)">
    <rect x="228" y="316" width="512" height="76" rx="16" fill="#252b36"/>

    <!-- 잡는 손잡이 -->
    <rect x="242" y="330" width="12" height="48" rx="6" fill="#3d4756"/>
    <circle cx="248" cy="345" r="1.9" fill="#8b95a6"/>
    <circle cx="248" cy="354" r="1.9" fill="#8b95a6"/>
    <circle cx="248" cy="363" r="1.9" fill="#8b95a6"/>

    <!-- 버튼들 -->
    <g font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#ffffff">
      <rect x="268" y="332" width="62" height="44" rx="10" fill="#4c8dff"/>
      <text x="299" y="361">인사</text>

      <rect x="340" y="332" width="62" height="44" rx="10" fill="#22b573"/>
      <text x="371" y="361">주소</text>

      <rect x="412" y="332" width="62" height="44" rx="10" fill="#f5a623"/>
      <text x="443" y="361">계좌</text>

      <rect x="484" y="332" width="62" height="44" rx="10" fill="#e2574c"/>
      <text x="515" y="361">감사</text>

      <rect x="556" y="332" width="62" height="44" rx="10" fill="#9b59b6"/>
      <text x="587" y="361">사진</text>

      <rect x="628" y="332" width="62" height="44" rx="10" fill="#16a5a5"/>
      <text x="659" y="361">링크</text>
    </g>

    <!-- 톱니바퀴 -->
    <g transform="translate(714 354)" fill="none" stroke="#c3cad6" stroke-width="2.4" stroke-linecap="round">
      <circle r="7.5"/>
      <circle r="3" fill="#c3cad6" stroke="none"/>
      <path d="M0 -13.5V-10M0 10v3.5M-13.5 0H-10M10 0h3.5M-9.5 -9.5l2.5 2.5M7 7l2.5 2.5M9.5 -9.5L7 -7M-7 7l-2.5 2.5"/>
    </g>
  </g>

  <!-- 설명 라벨 -->
  <g font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="13" fill="#4a5566">
    <path d="M248 322V300h-52" stroke="#7c8798" stroke-width="1.4" fill="none"/>
    <text x="190" y="296" text-anchor="end">끌어서 옮기는 손잡이</text>

    <path d="M515 396v18h84" stroke="#7c8798" stroke-width="1.4" fill="none"/>
    <text x="607" y="419">누르면 쓰던 창에 바로 붙습니다</text>

    <path d="M726 344h44v-26" stroke="#7c8798" stroke-width="1.4" fill="none"/>
    <text x="770" y="312" text-anchor="middle">설정</text>
  </g>
  </g>
</svg>
