<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="메두사 미용실의 카드 승패 관계를 나타낸 그림. 제우스는 헤라클레스를, 헤라클레스는 메두사를, 메두사는 다시 제우스를 이긴다.">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#14453a"/>
      <stop offset="1" stop-color="#082019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#1d6151" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d6151" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f6dda0"/>
      <stop offset="0.5" stop-color="#e3bd6b"/>
      <stop offset="1" stop-color="#cf9f3e"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d59a63"/>
      <stop offset="1" stop-color="#a8622f"/>
    </linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1d7d5c"/>
      <stop offset="1" stop-color="#0d4f39"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#e8c877"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="14" fill="url(#felt)"/>
  <rect width="960" height="540" rx="14" fill="url(#glow)"/>

  <text x="480" y="58" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#e8c877" letter-spacing="1">카드 승패 관계</text>

  <!-- 이김 화살표 (위) -->
  <g fill="none" stroke="#e8c877" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M238 140 Q 350 92 462 140" marker-end="url(#arrow)"/>
    <path d="M498 140 Q 610 92 722 140" marker-end="url(#arrow)"/>
  </g>
  <!-- 이김 화살표 (아래, 메두사 → 제우스) -->
  <g fill="none" stroke="#e8c877" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M744 372 C 730 462 250 462 236 372" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e8c877" text-anchor="middle">
    <text x="350" y="84">이김</text>
    <text x="610" y="84">이김</text>
    <text x="480" y="462">이김</text>
  </g>

  <!-- 제우스 -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="150" width="140" height="200" rx="14" fill="url(#goldCard)"/>
  </g>
  <g transform="translate(220 218)">
    <path d="M4 -24 L-16 4 h11 L-3 24 L17 -4 H5 z" fill="#5c410c" opacity="0.9"/>
  </g>
  <text x="220" y="278" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#4a340a">제우스</text>
  <text x="220" y="312" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" fill="#6b4d15">1장</text>

  <!-- 헤라클레스 -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="150" width="140" height="200" rx="14" fill="url(#blueCard)"/>
  </g>
  <g transform="translate(480 218)" fill="#f7e3cd" opacity="0.95">
    <path d="M-20 20 L-2 2" stroke="#f7e3cd" stroke-width="11" stroke-linecap="round"/>
    <circle cx="10" cy="-10" r="15"/>
  </g>
  <text x="480" y="278" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#fbeeda">헤라클레스</text>
  <text x="480" y="312" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" fill="#e8c6a2">5장</text>

  <!-- 메두사 -->
  <g filter="url(#cardShadow)">
    <rect x="670" y="150" width="140" height="200" rx="14" fill="url(#roseCard)"/>
  </g>
  <g transform="translate(740 218)">
    <g fill="none" stroke="#e9f6ef" stroke-width="4.5" stroke-linecap="round" opacity="0.95">
      <path d="M-11 -4 C-22 -8 -27 -19 -22 -27"/>
      <path d="M0 -9 C-4 -18 -2 -26 5 -30"/>
      <path d="M11 -4 C22 -8 27 -18 22 -26"/>
    </g>
    <circle cx="-21" cy="-29" r="4.6" fill="#e9f6ef"/>
    <circle cx="6" cy="-32" r="4.6" fill="#e9f6ef"/>
    <circle cx="23" cy="-28" r="4.6" fill="#e9f6ef"/>
    <circle cx="0" cy="9" r="16" fill="#e9f6ef"/>
  </g>
  <text x="740" y="278" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#eaf7f0">메두사</text>
  <text x="740" y="312" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" fill="#b9ded0">2장</text>

  <text x="480" y="508" text-anchor="middle" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="16" fill="#8fb3a6">숫자카드 52장 · 헤르메스 5장(항상 짐)</text>
</svg>
