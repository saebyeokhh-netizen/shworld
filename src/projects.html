<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>작품 — shworld</title>
    <meta name="description" content="지금까지 만든 것들. 제목·기술·태그로 바로 검색하고 걸러볼 수 있습니다." />
    <link rel="canonical" href="https://shworld.dev/projects.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="shworld" />
    <meta property="og:title" content="작품 — shworld" />
    <meta property="og:description" content="지금까지 만든 것들. 제목·기술·태그로 바로 검색하고 걸러볼 수 있습니다." />
    <meta property="og:url" content="https://shworld.dev/projects.html" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 첫 페인트 전에 테마를 확정한다 (다크 모드 플래시 방지)
      (function () { try { var t = localStorage.getItem("shworld:theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
    </script>
    <link rel="stylesheet" href="/styles/main.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body data-page="projects">
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">sh</span>
          <span class="brand__text">shworld</span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기">
          <span class="nav-toggle__bar"></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
          <ul class="site-nav__list">
            <li><a href="/projects.html" data-nav="projects">작품</a></li>
            <li><a href="/about.html" data-nav="about">소개</a></li>
            <li><a href="/guestbook.html" data-nav="guestbook">방명록</a></li>
            <li><a href="/contact.html" data-nav="contact">연락</a></li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="site-main" id="main">
      <div class="page-head">
        <div class="wrap">
          <span class="eyebrow">Work</span>
          <h1>작품</h1>
          <p class="lede">
            총 <!--@projects.count-->개. 검색어는 제목·요약·기술·본문까지 훑고, 태그는 여러 개를 겹쳐 고를 수 있습니다.
          </p>
        </div>
      </div>

      <section class="section">
        <div class="wrap">
          <!-- 필터 -->
          <div class="filter-bar">
            <div class="search-field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
              <label class="visually-hidden" for="project-search">작품 검색</label>
              <input
                id="project-search"
                type="search"
                placeholder="예: Cloudflare, 오프라인, CLI…"
                autocomplete="off"
                spellcheck="false"
              />
            </div>

            <ul class="filter-chips" id="tag-filters" aria-label="태그 필터">
              <!--@projects.tagChips-->
            </ul>

            <div class="section__head" style="margin-bottom: 0">
              <p class="filter-status" id="filter-status" role="status" aria-live="polite">
                총 <!--@projects.count-->개의 작품
              </p>
              <button class="btn btn--ghost" type="button" id="filter-reset" hidden>필터 초기화</button>
            </div>
          </div>

          <!-- 목록 (빌드 시점에 이미 렌더되어 있다 — JS 없이도 보인다) -->
          <ul class="card-grid card-grid--3" id="project-grid">
            <!--@projects.all-->
          </ul>

          <div class="empty-state" id="filter-empty" hidden>
            <h3>조건에 맞는 작품이 없습니다</h3>
            <p>검색어를 줄이거나 태그를 해제해 보세요.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer__inner">
        <p class="site-footer__note">© <span data-year><!--@site.year--></span> <!--@profile.name--> · 서버 없이 Cloudflare 에서 돌아갑니다</p>
        <nav aria-label="바닥글 링크">
          <ul>
            <li><a href="/projects.html">작품</a></li>
            <li><a href="/about.html">소개</a></li>
            <li><a href="/guestbook.html">방명록</a></li>
            <li><a href="/contact.html">연락</a></li>
            <li><a href="/sitemap.xml">사이트맵</a></li>
          </ul>
        </nav>
      </div>
    </footer>
  </body>
</html>
