<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연락 — shworld</title>
    <meta name="description" content="업무 제안, 협업, 질문 모두 환영합니다. 폼으로 남겨주시면 확인 후 답장 드립니다." />
    <link rel="canonical" href="https://shworld.dev/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="shworld" />
    <meta property="og:title" content="연락 — shworld" />
    <meta property="og:description" content="업무 제안, 협업, 질문 모두 환영합니다. 폼으로 남겨주시면 확인 후 답장 드립니다." />
    <meta property="og:url" content="https://shworld.dev/contact.html" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 첫 페인트 전에 테마를 확정한다 (다크 모드 플래시 방지)
      (function () { try { var t = localStorage.getItem("shworld:theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
    </script>
    <link rel="stylesheet" href="/styles/main.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body data-page="contact">
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">sh</span>
          <span class="brand__text">shworld</span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기">
          <span class="nav-toggle__bar"></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
          <ul class="site-nav__list">
            <li><a href="/projects.html" data-nav="projects">작품</a></li>
            <li><a href="/about.html" data-nav="about">소개</a></li>
            <li><a href="/guestbook.html" data-nav="guestbook">방명록</a></li>
            <li><a href="/contact.html" data-nav="contact">연락</a></li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="site-main" id="main">
      <div class="page-head">
        <div class="wrap wrap--narrow">
          <span class="eyebrow">Contact</span>
          <h1>연락하기</h1>
          <p class="lede">
            업무 제안, 협업, 질문 모두 환영합니다. 아래 폼으로 남겨주시면 확인 후 답장 드립니다.
            바로 메일을 쓰셔도 됩니다 — <a href="<!--@profile.emailHref-->"><!--@profile.email--></a>
          </p>
        </div>
      </div>

      <section class="section">
        <div class="wrap wrap--narrow">
          <form class="form" id="contact-form" novalidate>
            <div class="field">
              <label for="ct-name">이름</label>
              <input id="ct-name" name="name" type="text" maxlength="40" required autocomplete="name" placeholder="성함 또는 회사명" />
            </div>

            <div class="field">
              <label for="ct-email">이메일</label>
              <input id="ct-email" name="email" type="email" maxlength="254" required autocomplete="email" placeholder="you@example.com" />
              <p class="field__hint">답장을 받을 주소입니다. 다른 곳에 쓰거나 공개하지 않습니다.</p>
            </div>

            <div class="field">
              <div class="field__row">
                <label for="ct-message">내용</label>
                <span class="counter" id="ct-message-count">0 / 1000</span>
              </div>
              <textarea id="ct-message" name="message" maxlength="1000" required placeholder="어떤 이야기인지 간단히 알려주세요."></textarea>
            </div>

            <div class="turnstile-slot" id="contact-turnstile"></div>

            <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>

            <div class="form__foot">
              <p class="field__hint" style="margin: 0">스팸 방지를 위해 5분에 한 번만 보낼 수 있습니다.</p>
              <button class="btn btn--primary" type="submit">보내기</button>
            </div>
          </form>

          <ul class="link-list" style="margin-top: var(--space-6)">
            <!--@profile.links-->
          </ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer__inner">
        <p class="site-footer__note">© <span data-year><!--@site.year--></span> <!--@profile.name--> · 서버 없이 Cloudflare 에서 돌아갑니다</p>
        <nav aria-label="바닥글 링크">
          <ul>
            <li><a href="/projects.html">작품</a></li>
            <li><a href="/about.html">소개</a></li>
            <li><a href="/guestbook.html">방명록</a></li>
            <li><a href="/contact.html">연락</a></li>
            <li><a href="/sitemap.xml">사이트맵</a></li>
          </ul>
        </nav>
      </div>
    </footer>
  </body>
</html>
