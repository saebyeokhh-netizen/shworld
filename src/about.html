<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>소개 — shworld</title>
    <meta name="description" content="어떤 개발자인지, 무엇을 다루는지, 어떤 순서로 배워왔는지." />
    <link rel="canonical" href="<!--@site.url-->/about.html" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="shworld" />
    <meta property="og:title" content="소개 — shworld" />
    <meta property="og:description" content="어떤 개발자인지, 무엇을 다루는지, 어떤 순서로 배워왔는지." />
    <meta property="og:url" content="<!--@site.url-->/about.html" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 첫 페인트 전에 테마를 확정한다 (다크 모드 플래시 방지)
      (function () { try { var t = localStorage.getItem("shworld:theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
    </script>
    <!--
      애드센스. 게임과 같은 계정·같은 게시자 ID 를 쓴다 — 둘 다 shworld.cloud 라
      애드센스에게는 같은 사이트 하나이고, 권한을 밝히는 ads.txt 도 도메인 맨 위
      한 곳(shworld.cloud/ads.txt)이 둘을 함께 담당한다.

      404 페이지에는 넣지 않는다. 내용이 없는 페이지에 광고를 띄우는 것은
      애드센스 정책에 어긋난다.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8646263697877187"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/styles/main.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body data-page="about">
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">sh</span>
          <span class="brand__text">shworld</span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기">
          <span class="nav-toggle__bar"></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
          <ul class="site-nav__list">
            <li><a href="/projects.html" data-nav="projects">작품</a></li>
            <li><a href="/about.html" data-nav="about">소개</a></li>
            <li><a href="/guestbook.html" data-nav="guestbook">방명록</a></li>
            <li><a href="/contact.html" data-nav="contact">연락</a></li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="site-main" id="main">
      <div class="page-head">
        <div class="wrap">
          <span class="eyebrow"><!--@profile.role--> · <!--@profile.location--></span>
          <h1><!--@profile.name--></h1>
          <p class="lede"><!--@profile.tagline--></p>
        </div>
      </div>

      <!-- 소개 -->
      <section class="section">
        <div class="wrap">
          <article class="prose">
            <!--@profile.bio-->
          </article>

          <ul class="link-list" style="margin-top: var(--space-6)">
            <!--@profile.links-->
          </ul>
        </div>
      </section>

      <!-- 기술 -->
      <section class="section section--alt">
        <div class="wrap">
          <div class="section__head">
            <div>
              <span class="eyebrow">Skills</span>
              <h2>다루는 기술</h2>
              <p>업무나 개인 프로젝트에서 실제로 배포까지 해 본 것들만 적었습니다.</p>
            </div>
          </div>

          <ul class="skill-groups">
            <!--@profile.skills-->
          </ul>
        </div>
      </section>

      <!-- 타임라인 -->
      <section class="section">
        <div class="wrap wrap--narrow">
          <div class="section__head">
            <div>
              <span class="eyebrow">Timeline</span>
              <h2>지나온 길</h2>
            </div>
          </div>

          <ol class="timeline">
            <!--@profile.timeline-->
          </ol>
        </div>
      </section>

      <!-- CTA -->
      <section class="section section--tight">
        <div class="wrap wrap--narrow">
          <div class="cta">
            <h2>작품을 더 보고 싶다면</h2>
            <p>각 작품마다 무엇을 만들었고 무엇이 어려웠는지 정리해 두었습니다.</p>
            <div class="hero__actions">
              <a class="btn btn--primary" href="/projects.html">작품 <!--@projects.count-->개 보기</a>
              <a class="btn btn--ghost" href="/contact.html">연락하기</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer__inner">
        <p class="site-footer__note">© <span data-year><!--@site.year--></span> <!--@profile.name--> · 서버 없이 Cloudflare 에서 돌아갑니다</p>
        <nav aria-label="바닥글 링크">
          <ul>
            <li><a href="/projects.html">작품</a></li>
            <li><a href="/about.html">소개</a></li>
            <li><a href="/guestbook.html">방명록</a></li>
            <li><a href="/contact.html">연락</a></li>
            <li><a href="/sitemap.xml">사이트맵</a></li>
            <!--
              개인정보처리방침. 애드센스 심사가 요구하는 문서이고, 방문자가 어느 페이지에
              있든 찾을 수 있어야 한다. 문서 자체는 같은 도메인의 게임 쪽에 있고
              /privacy 가 그리로 보낸다 — 도메인이 하나라 방침도 하나면 된다.
            -->
            <li><a href="/privacy">개인정보처리방침</a></li>
          </ul>
        </nav>

        <button class="share-btn" type="button" data-share>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/></svg>
          <span data-share-label>이 페이지 공유</span>
          <span class="visually-hidden" role="status" data-share-status></span>
        </button>
      </div>
    </footer>
  </body>
</html>
